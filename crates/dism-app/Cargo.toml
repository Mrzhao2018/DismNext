[package]
name = "dism-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
dism-core = { path = "../dism-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiny_http = "0.12"
windows-sys = { version = "0.59", features = ["Win32_Security_Cryptography", "Win32_Storage_FileSystem"] }
