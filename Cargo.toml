[workspace]
resolver = "2"
members = [
    "crates/dism-core",
    "crates/dism-cli",
    "crates/dism-app",
]

[workspace.package]
version = "2.2.0"
edition = "2021"
license = "MIT"
authors = ["DismNext Contributors"]

[workspace.dependencies]
flate2 = "1.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
