name: Windows CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci --no-audit
      - name: Lint frontend
        working-directory: ui
        run: npm run lint
      - name: Test frontend
        working-directory: ui
        run: npm test
      - name: Build frontend
        working-directory: ui
        run: npm run build
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Check Rust formatting
        run: cargo +stable fmt --all -- --check
      - name: Lint Rust workspace
        run: cargo +stable clippy --workspace --all-targets --locked -- -D warnings
      - name: Test Rust workspace and validate catalog
        run: cargo +stable test --workspace --locked
      - name: Build release binaries
        run: cargo +stable build --release --workspace --locked
      - name: Package Windows release files
        run: ./scripts/package_windows.ps1 -OutputDirectory ./target/windows-release
      - name: Verify Windows release package
        run: ./scripts/check_windows_package.ps1 -PackageDirectory ./target/windows-release
      - name: Upload verified Windows release files
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: dismnext-windows-x64
          path: target/windows-release/
          if-no-files-found: error
          retention-days: 14
